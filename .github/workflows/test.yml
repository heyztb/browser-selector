name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh release native
      - name: Verify app bundle
        run: ./scripts/verify-app.sh
      - name: Check universal release reproducibility
        run: ./scripts/check-reproducibility.sh
