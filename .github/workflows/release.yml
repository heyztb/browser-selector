name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/browser-selector.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Build signed universal app
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          version=${GITHUB_REF_NAME#v}
          RELEASE_VERSION="$version" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh release universal
          ./scripts/verify-app.sh

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          submission="$RUNNER_TEMP/BrowserSelector-submission.zip"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key_path"
          ditto -c -k --keepParent ".build/Browser Selector.app" "$submission"
          xcrun notarytool submit "$submission" --key "$key_path" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple ".build/Browser Selector.app"
          xcrun stapler validate ".build/Browser Selector.app"
          spctl --assess --type execute --verbose=2 ".build/Browser Selector.app"

      - name: Package release
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="BrowserSelector-$version-macos-universal.zip"
          ditto -c -k --keepParent ".build/Browser Selector.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
